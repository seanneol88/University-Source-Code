name: Build and deploy site

# Rebuilds the site and the auto-generated READMEs from the repository itself.
# Runs on every push to main, on demand, and once a week so the index never drifts.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # every Monday, 03:17 UTC

permissions:
  contents: write      # lets the job commit the refreshed READMEs
  pages: write         # lets the job publish to GitHub Pages
  id-token: write      # required by actions/deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet --disable-pip-version-check markdown

      - name: Build site and refresh READMEs
        run: python scripts/build_site.py --out _site

      - name: Commit refreshed READMEs
        # Pushes made with GITHUB_TOKEN do not retrigger this workflow, so there is no loop.
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md '*/README.md'
          if git diff --cached --quiet; then
            echo "READMEs already up to date"
          else
            git commit -m "docs: refresh auto-generated README index [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # creates the Pages site on the first run so no manual setup is needed
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
